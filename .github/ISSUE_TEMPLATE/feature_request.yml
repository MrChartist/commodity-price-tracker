name: Feature request
description: Suggest an improvement or a new commodity
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: input
    id: source
    attributes:
      label: Free data source (for new commodities)
