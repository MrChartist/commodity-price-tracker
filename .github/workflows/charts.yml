name: Update chart history and open interest

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-publish
  cancel-in-progress: false

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch chart history
        run: node scripts/fetch-charts.js out
      - name: Fetch open interest (CFTC)
        run: node scripts/fetch-oi.js out
      - name: Publish to data branch
        run: scripts/publish-data.sh out
